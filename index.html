<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>onescroll.dev</title>
  <meta name="description" content="Single-page deep dives. One topic per path.">
  <style>
    :root {
      --bg: #f7f5f0;
      --ink: #1a1a1a;
      --dim: #6b6b6b;
      --line: #e3ddd2;
      --accent: #b8512f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14130f;
        --ink: #ece8e0;
        --dim: #8a8478;
        --line: #2a2823;
        --accent: #e07a55;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      min-height: 100vh;
      padding: clamp(32px, 6vw, 80px) clamp(20px, 5vw, 64px);
    }
    header {
      max-width: 720px;
      margin: 0 auto 64px;
    }
    h1 {
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      font-size: clamp(40px, 8vw, 80px);
      font-weight: 400;
      letter-spacing: -0.03em;
      margin: 0 0 16px;
      line-height: 1;
    }
    h1 .dot { color: var(--accent); }
    .tagline {
      color: var(--dim);
      font-size: 18px;
      max-width: 52ch;
      margin: 0;
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
    }
    .topics {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
    }
    .topic {
      background: var(--bg);
      padding: 24px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: background 0.15s;
    }
    .topic:hover { background: color-mix(in srgb, var(--bg) 85%, var(--ink) 15%); }
    .topic-title {
      font-family: ui-serif, Georgia, serif;
      font-size: 24px;
      font-weight: 500;
      line-height: 1.2;
      margin: 0;
    }
    .topic-blurb {
      color: var(--dim);
      font-size: 14px;
      line-height: 1.5;
      margin: 0;
      flex: 1;
    }
    .topic-meta {
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 12px;
      color: var(--dim);
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      letter-spacing: 0.02em;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .badge.evergreen { color: #2d7a4f; border-color: #2d7a4f; }
    .badge.slow      { color: #7a6a2d; border-color: #7a6a2d; }
    .badge.fast      { color: #b8512f; border-color: #b8512f; }
    .stale { opacity: 0.6; }
    .stale-marker {
      color: var(--accent);
      font-weight: 600;
    }
    .empty {
      padding: 40px;
      text-align: center;
      color: var(--dim);
      border: 1px dashed var(--line);
    }
    footer {
      max-width: 1100px;
      margin: 80px auto 0;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      color: var(--dim);
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <header>
    <h1>onescroll<span class="dot">.</span>dev</h1>
    <p class="tagline">
      Single-page deep dives. One topic per path. Each page is its own
      design, written to actually explain something.
    </p>
  </header>

  <main>
    <div class="topics" id="topics"></div>
  </main>

  <footer>
    <span id="count"></span>
    <span><a href="https://github.com/ryanrdetzel/onescroll">source</a></span>
  </footer>

  <script>
    const STALE = { evergreen: 365 * 3, slow: 365, fast: 180 };

    function ageDays(iso) {
      return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
    }
    function fmtAge(d) {
      if (d < 30)  return `${d}d ago`;
      if (d < 365) return `${Math.floor(d / 30)}mo ago`;
      const y = (d / 365).toFixed(1).replace(/\.0$/, '');
      return `${y}y ago`;
    }

    fetch('/manifest.json')
      .then(r => r.json())
      .then(({ topics }) => {
        const el = document.getElementById('topics');
        if (!topics || topics.length === 0) {
          el.outerHTML = '<div class="empty">No topics yet. The first one is on its way.</div>';
          return;
        }
        topics
          .slice()
          .sort((a, b) => new Date(b.generated) - new Date(a.generated))
          .forEach(t => {
            const age = ageDays(t.generated);
            const limit = STALE[t.volatility] ?? 365;
            const stale = age > limit;
            const a = document.createElement('a');
            a.className = 'topic' + (stale ? ' stale' : '');
            a.href = `/topics/${t.slug}/`;
            a.innerHTML = `
              <h2 class="topic-title">${t.title}</h2>
              <p class="topic-blurb">${t.blurb || ''}</p>
              <div class="topic-meta">
                <span class="badge ${t.volatility}">${t.volatility}</span>
                <span>${fmtAge(age)}${stale ? ' <span class="stale-marker">· stale</span>' : ''}</span>
              </div>
            `;
            el.appendChild(a);
          });
        document.getElementById('count').textContent =
          `${topics.length} topic${topics.length === 1 ? '' : 's'}`;
      })
      .catch(() => {
        document.getElementById('topics').outerHTML =
          '<div class="empty">Could not load manifest.json</div>';
      });
  </script>
</body>
</html>
